<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMate - 로그인</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            color: #2d6a4f;
            font-weight: 700;
        }
        .logo p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #2d6a4f; }
        button {
            width: 100%;
            padding: 16px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background: #1b4332; }
        .error {
            color: #e63946;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🌿 MarketMate</h1>
            <p>시장 상인을 위한 스마트 관리</p>
        </div>
        <div class="form-group">
            <label>아이디</label>
            <input type="text" id="loginId" placeholder="아이디 입력" />
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="loginPw" placeholder="비밀번호 입력" />
        </div>
        <button onclick="login()">로그인</button>
        <p style="text-align:center; margin-top:15px; color:#888; font-size:14px;">
            계정이 없으신가요?
            <a href="signup.html" style="color:#2d6a4f; font-weight:700;">회원가입</a>
        </p>
        <p class="error" id="errorMsg">아이디 또는 비밀번호가 틀렸습니다</p>
    </div>

    <script>
        const API = 'http://localhost:8081';

        async function login() {
            const loginId = document.getElementById('loginId').value;
            const loginPw = document.getElementById('loginPw').value;

            try {
                const res = await fetch(`${API}/api/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId, loginPw })
                });

                if (!res.ok) throw new Error('로그인 실패');

                const data = await res.json();
                localStorage.setItem('accessToken', data.data.accessToken);
                localStorage.setItem('refreshToken', data.data.refreshToken);
                localStorage.setItem('userId', data.data.userId);

                window.location.href = 'index.html';
            } catch (e) {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // 엔터키 로그인
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
