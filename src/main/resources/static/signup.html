<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMate - 회원가입</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 { font-size: 24px; color: #2d6a4f; font-weight: 700; }
        .logo p { color: #888; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #2d6a4f; }
        button {
            width: 100%;
            padding: 16px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background: #1b4332; }
        .error {
            color: #e63946;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
        .login-link a { color: #2d6a4f; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🌿 MarketMate</h1>
            <p>회원가입</p>
        </div>
        <div class="form-group">
            <label>아이디</label>
            <input type="text" id="loginId" placeholder="아이디 입력" />
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="loginPw" placeholder="비밀번호 입력" />
        </div>
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="name" placeholder="이름 입력" />
        </div>
        <div class="form-group">
            <label>전화번호</label>
            <input type="text" id="phone" placeholder="010-0000-0000" />
        </div>
        <div class="form-group">
            <label>가게명</label>
            <input type="text" id="storeName" placeholder="예) 김씨네 채소" />
        </div>
        <div class="form-group">
            <label>시장명</label>
            <input type="text" id="marketName" placeholder="예) 영양시장" />
        </div>
        <button onclick="signup()">회원가입</button>
        <p class="error" id="errorMsg">회원가입에 실패했습니다</p>
        <p class="login-link">
            이미 계정이 있으신가요?
            <a href="login.html">로그인</a>
        </p>
    </div>

    <script>
        const API = 'http://localhost:8081';

        async function signup() {
            const loginId = document.getElementById('loginId').value;
            const loginPw = document.getElementById('loginPw').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const storeName = document.getElementById('storeName').value;
            const marketName = document.getElementById('marketName').value;

            if (!loginId || !loginPw || !name || !phone || !storeName || !marketName) {
                document.getElementById('errorMsg').innerText = '모든 항목을 입력해주세요';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API}/api/user/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId, loginPw, name, phone, storeName, marketName })
                });

                if (!res.ok) throw new Error('회원가입 실패');

                alert('회원가입 완료! 로그인해주세요.');
                window.location.href = 'login.html';
            } catch (e) {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
